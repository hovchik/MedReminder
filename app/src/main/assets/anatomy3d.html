<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  Setup
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);

const controls = new OrbitControls(camera, renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// ============================================================
//  Utility: Lathe body part from profile points
// ============================================================
// points = [[radius, height], ...] — creates smooth lathe geometry
function latheFromProfile(points, segments = 32) {
  const curve = new THREE.CatmullRomCurve3(
    points.map(([r, y]) => new THREE.Vector3(r, y, 0)),
    false, 'catmullrom', 0.5
  );
  const sampled = curve.getPoints(60);
  const vec2s = sampled.map(p => new THREE.Vector2(Math.max(p.x, 0), p.y));
  return new THREE.LatheGeometry(vec2s, segments);
}

// Smooth limb: tapered cylinder with rounded ends
function smoothLimb(rTop, rBot, length, segments = 16) {
  const pts = [];
  // top cap
  for (let i = 0; i <= 6; i++) {
    const a = (Math.PI / 2) * (i / 6);
    pts.push([Math.sin(a) * rTop, length / 2 + Math.cos(a) * rTop * 0.4]);
  }
  // shaft
  pts.push([rTop, length * 0.3]);
  pts.push([rTop * 0.98 + rBot * 0.02, length * 0.1]);
  pts.push([rTop * 0.6 + rBot * 0.4, -length * 0.15]);
  pts.push([rBot * 1.02, -length * 0.3]);
  // bottom cap
  for (let i = 0; i <= 6; i++) {
    const a = (Math.PI / 2) * (i / 6);
    pts.push([Math.cos(a) * rBot, -length / 2 - Math.sin(a) * rBot * 0.4]);
  }
  return latheFromProfile(pts, segments);
}

// ============================================================
//  Materials
// ============================================================
const skinColor = 0xd4a088;

});

  color, roughness: 0.5, metalness: 0.05, transparent: true, opacity

});

  color, roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.92,
  emissive: new THREE.Color(color), emissiveIntensity: 0.35

// ============================================================
//  Body group + organ registry
// ============================================================
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);
const organs = {};

function addOrgan(name, geometry, material, position, rotation, scale, region) {
  const mesh = new THREE.Mesh(geometry, material);
  if (position) mesh.position.set(...position);
  if (rotation) mesh.rotation.set(...rotation);
  if (scale) {
    if (typeof scale === 'number') mesh.scale.setScalar(scale);
    else mesh.scale.set(...scale);
  }
  mesh.userData = { name, region, defaultMat: material };
  bodyGroup.add(mesh);
  if (!organs[region]) organs[region] = [];
  organs[region].push(mesh);
  return mesh;
}

  // Forearm — tapers to wrist

    [0, 0.18],
    [0.044, 0.16],
    [0.048, 0.10],     // forearm bulk
    [0.046, 0.04],

    [s * 0.43, 0.74, 0.01], [0.04, 0, s * 0.05], null, 'JOINTS');

  // Wrist
  const wristGeo = new THREE.SphereGeometry(0.026, 10, 8);
  addOrgan(`${side}_wrist`, wristGeo, skinMat.clone(),
    [s * 0.45, 0.57, 0.02], null, [1, 0.7, 0.85], 'JOINTS');

  // Hand — flat tapered shape
  const handShape = new THREE.Shape();
  handShape.moveTo(-0.028, -0.04);
  handShape.quadraticCurveTo(-0.032, 0, -0.025, 0.03);
  handShape.lineTo(-0.018, 0.045);
  handShape.lineTo(-0.006, 0.05);
  handShape.lineTo(0.006, 0.05);
  handShape.lineTo(0.018, 0.045);
  handShape.lineTo(0.025, 0.03);
  handShape.quadraticCurveTo(0.032, 0, 0.028, -0.04);
  handShape.quadraticCurveTo(0, -0.05, -0.028, -0.04);

  });
  addOrgan(`${side}_hand`, handGeo, solidSkinMat.clone(),
    [s * 0.46, 0.50, 0.01], null, null, 'JOINTS');

  // Fingers
  for (let i = 0; i < 4; i++) {
    const fx = -0.018 + i * 0.012;
    const fLen = 0.05 + (i === 1 ? 0.008 : i === 2 ? 0.005 : 0);
    const fGeo = smoothLimb(0.007, 0.005, fLen, 8);
    addOrgan(`${side}_finger_${i}`, fGeo, solidSkinMat.clone(),
      [s * (0.445 + fx * s), 0.44 - fLen / 2, 0.02], null, null, 'JOINTS');
  }
  // Thumb
  const thumbGeo = smoothLimb(0.009, 0.007, 0.04, 8);
  addOrgan(`${side}_thumb`, thumbGeo, solidSkinMat.clone(),
    [s * 0.485, 0.49, 0.03], [0.3, 0, s * 0.5], null, 'JOINTS');
}
createArm('left');
createArm('right');

    depth: 0.035, bevelEnabled: true, bevelSize: 0.005, bevelThickness: 0.004, bevelSegments: 3

  addOrgan(`${side}_foot`, footGeo, solidSkinMat.clone(),
    [s * 0.12, -0.31, 0.03], [-Math.PI / 2, 0, 0], null, 'BONES');

  // Toes hint

      [s * (0.12 + tx), -0.315, 0.095 + (i === 0 ? 0.01 : 0)], null, [0.7, 0.5, 1], 'BONES');

}

      yPos - Math.sin(a * 0.5) * 0.01,
      Math.cos(a) * ribD - 0.01

// ============================================================
//  Highlight API
// ============================================================
const highlightColors = {
  HEAD: 0x66bbff, EYES: 0x44aaff, EARS: 0x55aacc,
  THROAT: 0x77ccdd, HEART: 0xff4466, LUNGS: 0xff8899,
  STOMACH: 0xffaa44, LIVER: 0xcc7733, KIDNEYS: 0xdd8855,
  JOINTS: 0x44dd88, SKIN: 0xffcc88, BLOOD: 0xff3333,
  IMMUNE: 0x44cc66, HORMONES: 0xddaa33, NERVOUS_SYSTEM: 0xcc88ff,
  BONES: 0xeeeedd, FULL_BODY: 0x66aaff
};

const regionLabels = {
  HEAD: 'Head / Brain', EYES: 'Eyes', EARS: 'Ears',
  THROAT: 'Throat', HEART: 'Heart', LUNGS: 'Lungs',
  STOMACH: 'Stomach / GI', LIVER: 'Liver', KIDNEYS: 'Kidneys',
  JOINTS: 'Joints / Muscles', SKIN: 'Skin', BLOOD: 'Blood / Circulation',
  IMMUNE: 'Immune System', HORMONES: 'Hormonal / Endocrine',
  NERVOUS_SYSTEM: 'Nervous System', BONES: 'Bones', FULL_BODY: 'Full Body / Systemic'
};

let currentHighlights = [];

function clearHighlights() {
  for (const region in organs) {
    organs[region].forEach(mesh => {
      if (mesh.userData.defaultMat) mesh.material = mesh.userData.defaultMat;
    });
  }
  currentHighlights = [];
  document.getElementById('label').classList.remove('show');
}

function highlightRegions(regionListJson) {
  clearHighlights();
  let regionList;
  try { regionList = JSON.parse(regionListJson); } catch (e) { regionList = [regionListJson]; }

  currentHighlights = regionList;
  const labels = [];

  regionList.forEach(region => {
    const color = highlightColors[region] || 0x66bbff;
    const mat = highlightMat(color);
    if (organs[region]) organs[region].forEach(mesh => { mesh.material = mat; });
    if (regionLabels[region]) labels.push(regionLabels[region]);
  });

  if (labels.length > 0) {
    const labelEl = document.getElementById('label');
    labelEl.textContent = labels.join(' \u2022 ');
    labelEl.classList.add('show');
  }
}

window.highlightRegions = highlightRegions;
window.clearHighlights = clearHighlights;

// ============================================================
//  Resize
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
//  Animation loop
// ============================================================
let pulseTime = 0;
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  pulseTime += 0.03;

  currentHighlights.forEach(region => {
    if (organs[region]) {
      organs[region].forEach(mesh => {
        if (mesh.material.emissive) {
          mesh.material.emissiveIntensity = 0.25 + Math.sin(pulseTime * 2) * 0.15;
        }
      });
    }
  });

  renderer.render(scene, camera);
}
animate();

// ============================================================
//  Notify Android
// ============================================================
if (window.AndroidBridge) window.AndroidBridge.onModelReady();
